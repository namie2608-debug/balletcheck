<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>急速芭蕾挑戰 Ballet Check</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1a2e;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 128, 0.15), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.15), transparent 30%);
            color: #fff;
            overflow-x: hidden;
        }

        .font-pixel {
            font-family: 'Press Start 2P', 'Noto Sans TC', cursive;
            line-height: 1.5;
        }

        .neon-title {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00de, 0 0 40px #ff00de, 0 0 80px #ff00de;
            animation: pulsate 1.5s infinite alternate;
        }

        @keyframes pulsate {
            100% { text-shadow: 0 0 4px #fff, 0 0 11px #fff, 0 0 19px #ff00de, 0 0 40px #ff00de, 0 0 80px #ff00de; }
            0% { text-shadow: 0 0 2px #fff, 0 0 4px #fff, 0 0 6px #ff00de, 0 0 10px #ff00de, 0 0 45px #ff00de; }
        }

        .btn-game {
            transition: all 0.2s ease-in-out;
            border-bottom-width: 4px;
            text-transform: uppercase;
        }
        
        .btn-game:hover:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
            filter: brightness(1.1);
        }

        .btn-game:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 0px;
        }

        .btn-game:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-bottom-width: 0px;
            transform: translateY(4px);
        }

        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .screen-container {
            display: none;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }
        .screen-container.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 血條與倒數計時條 */
        .progress-bar-bg {
            background-color: #374151;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .health-bar-fill {
            height: 100%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
        }
        .timer-bar-fill {
            height: 100%;
            transition: width 0.1s linear, background-color 0.3s;
            background: #eab308;
        }

        /* 分數彈跳動畫 */
        @keyframes scorePopUp {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            80% { opacity: 1; transform: translateY(-30px) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
        }
        .score-popup {
            position: absolute;
            top: 20px;
            right: 10px;
            font-weight: 900;
            font-size: 1.75rem;
            pointer-events: none;
            animation: scorePopUp 1.2s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Modal 隱藏/顯示 */
        .modal {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            display: flex;
            opacity: 1;
        }
        
        /* 選中狀態特效 */
        .btn-selected {
            box-shadow: 0 0 15px currentColor;
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="screenMenu" class="screen-container active flex-col items-center w-full">
        <!-- 標題區 -->
        <header class="text-center mb-10 w-full max-w-4xl floating">
            <h2 class="text-xl md:text-2xl text-cyan-400 font-bold mb-2 tracking-widest">教材設計：黃翊倫</h2>
            <h1 class="text-4xl md:text-6xl font-pixel neon-title mt-4 mb-4 leading-tight">急速芭蕾挑戰<br><span class="text-2xl md:text-4xl text-yellow-300">Ballet Check</span></h1>
        </header>

        <!-- 主要選單區 -->
        <main class="w-full max-w-3xl bg-gray-900 bg-opacity-80 p-8 rounded-3xl border-4 border-cyan-500 shadow-[0_0_20px_rgba(0,255,255,0.4)]">
            
            <div class="mb-8 text-center">
                <button onclick="goToInstructions()" class="btn-game w-full md:w-2/3 bg-gradient-to-r from-green-400 to-emerald-600 border-green-700 text-white font-bold py-4 px-8 rounded-2xl text-2xl shadow-lg shadow-green-500/50">
                    🚀 進入教學關卡
                </button>
            </div>
            <hr class="border-gray-600 my-6 border-dashed">

            <!-- 遊戲設定區 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- 選擇對戰人數 -->
                <div class="bg-gray-800 p-6 rounded-2xl border-2 border-pink-500">
                    <h3 class="text-xl font-bold text-pink-400 mb-4 text-center font-pixel text-sm md:text-base">選擇對戰人數</h3>
                    <div class="flex flex-col gap-3">
                        <button id="btnPlayer1" onclick="setPlayerCount(1)" class="btn-game setting-btn bg-pink-500 border-pink-700 text-white font-bold py-3 px-4 rounded-xl">單人挑戰 (1P)</button>
                        <button id="btnPlayer2" onclick="setPlayerCount(2)" class="btn-game setting-btn bg-purple-500 border-purple-700 text-white font-bold py-3 px-4 rounded-xl">雙人同機 (2P)</button>
                        <button id="btnPlayer4" onclick="setPlayerCount(4)" class="btn-game setting-btn bg-indigo-500 border-indigo-700 text-white font-bold py-3 px-4 rounded-xl">四人同機 (4P)</button>
                    </div>
                </div>

                <!-- 選擇難度 -->
                <div class="bg-gray-800 p-6 rounded-2xl border-2 border-yellow-500 flex flex-col">
                    <h3 class="text-xl font-bold text-yellow-400 mb-4 text-center font-pixel text-sm md:text-base">選擇難度</h3>
                    <div class="flex flex-col gap-4 justify-center flex-1">
                        <button id="btnDiff1" onclick="setDifficulty(1)" class="btn-game diff-btn bg-yellow-500 border-yellow-700 text-gray-900 font-extrabold py-4 px-4 rounded-xl text-xl">
                            ⭐ LEVEL(初階)
                        </button>
                        <button id="btnDiff2" onclick="setDifficulty(2)" class="btn-game diff-btn bg-orange-500 border-orange-700 text-white font-extrabold py-4 px-4 rounded-xl text-xl">
                            ⭐⭐ LEVEL(進階)
                        </button>
                    </div>
                </div>
            </div>

            <!-- 資料統計區 -->
            <div class="mt-8 text-center">
                <button id="openStatsBtn" class="btn-game bg-blue-600 hover:bg-blue-500 border-blue-800 text-white font-bold py-3 px-6 rounded-xl flex items-center justify-center mx-auto gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    班級錯題統計
                </button>
            </div>
        </main>
    </div>

    <div id="screenInstructions" class="screen-container flex-col items-center justify-center w-full max-w-3xl bg-gray-900 bg-opacity-95 p-10 rounded-3xl border-4 border-green-500 shadow-[0_0_30px_rgba(34,197,94,0.6)]">
        <h2 class="text-4xl text-green-400 font-pixel mb-6 neon-title">遊戲規則</h2>
        
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-600 w-full mb-8 text-lg md:text-xl space-y-4">
            <p class="flex items-start"><span class="text-yellow-400 mr-3">📱</span> <strong class="text-purple-400 mx-1">多人模式說明：</strong>請將平板平放於桌面，玩家各據一方同時作答。</p>
            <p class="flex items-start"><span class="text-yellow-400 mr-3">🎮</span> 初始血量為 <strong class="text-blue-400 mx-1">60</strong> 分，先達到 <strong class="text-green-400 mx-1">150</strong> 分者獲勝！</p>
            <p class="flex items-start"><span class="text-yellow-400 mr-3">⏱️</span> 每題有限時（初階 10 秒 / 進階 7 秒）。</p>
            <p class="flex items-start"><span class="text-yellow-400 mr-3">💡</span> 系統會出現關鍵字，請盡快判斷屬於哪一種芭蕾風格。</p>
            <div class="bg-gray-700 p-4 rounded-lg mt-2 text-base space-y-2 border-l-4 border-yellow-500">
                <p>🏆 <strong class="text-yellow-300">第一名</strong>答對：<span class="text-green-400 font-bold">+15 分</span></p>
                <p>🥈 <strong class="text-gray-300">第二名</strong>答對：<span class="text-blue-400 font-bold">+5 分</span></p>
                <p>🥉 <strong class="text-orange-300">其他</strong>答對：<span class="text-gray-400 font-bold">+0 分</span></p>
                <p>❌ 答錯或超時：<span class="text-red-500 font-bold">-15 分</span> 😭</p>
            </div>
        </div>

        <div class="flex gap-4 w-full justify-center">
            <button onclick="showScreen('screenMenu')" class="btn-game bg-gray-600 hover:bg-gray-500 border-gray-800 text-white font-bold py-4 px-8 rounded-2xl text-xl">
                返回設定
            </button>
            <button onclick="startGame()" class="btn-game bg-gradient-to-r from-yellow-400 to-orange-500 border-orange-700 text-gray-900 font-black py-4 px-12 rounded-2xl text-2xl shadow-lg shadow-orange-500/50 animate-pulse">
                Let's Go! 🚀
            </button>
        </div>
    </div>

    <div id="screenGame" class="screen-container w-full h-full fixed inset-0 flex-col bg-gray-900 z-50 overflow-hidden">
        
        <!-- 頂部資訊列 (固定不轉) -->
        <div class="flex justify-between items-center p-2 md:p-4 bg-gray-800 border-b-2 border-cyan-500 shrink-0">
            <div class="text-xs md:text-base text-gray-300 font-bold">目標分數: <span class="text-green-400">150</span></div>
            <div id="roundIndicator" class="text-yellow-400 font-pixel text-sm md:text-lg">Round 1</div>
            <button onclick="showScreen('screenMenu')" class="text-gray-500 hover:text-white text-xs md:text-sm underline">放棄遊戲</button>
        </div>

        <!-- 遊戲板區域 (將根據人數動態切割與旋轉) -->
        <div class="flex-1 w-full bg-black flex items-center justify-center p-1 md:p-2 relative overflow-hidden" id="boardWrapper">
            <div id="gameBoard" class="transition-all duration-300">
                <!-- 玩家區域將由 JS 動態生成並注入於此 -->
            </div>
        </div>
    </div>

    <div id
